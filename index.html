<style>

*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#0b0d10,#101318 50%,#0b0d10);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

2, 56, 68, 98, 64]}, {"name": "iPad Air 13\" 2025", "weeks": [5, 3, 5, 5, 3, 6, 4]}, {"name": "iPad Air 13\" 2026", "weeks": [75, 54, 37, 27, 32, 68, 32]}, {"name": "iPad Pro 11\" 2024 STD", "weeks": [2, 1, 3, 3, 2, 6, 0]}, {"name": "iPad Pro 13\" 2024 STD", "weeks": [0, 0, 1, 1, 0, 0, 0]}, {"name": "iPad Pro M5 11\" 2025 NANO", "weeks": [0, 1, 0, 0, 0, 0, 0]}, {"name": "iPad Pro M5 11\" 2025 STD", "weeks": [62, 49, 28, 14, 17, 42, 16]}, {"name": "iPad Pro M5 13\" 2025 STD", "weeks": [58, 40, 40, 22, 13, 32, 12]}]}, "deep": {"Mac": {"coverage": "Aug 9–12", "days": 4, "w7": 894, "w6_same": 692, "w6_full": 1310, "exit": 1692.398843930636, "same_chg": 29.190751445086715, "exit_chg": 29.190751445086715, "w7_rev": 120985020, "w6_same_rev": 95366399, "w6_full_rev": 180450653, "exit_rev": 228925765.1661783}, "iPhone": {"coverage": "Aug 9–12", "days": 4, "w7": 4538, "w6_same": 2846, "w6_full": 5904, "exit": 9414.037947997189, "same_chg": 59.45186226282502, "exit_chg": 59.45186226282502, "w7_rev": 408875534, "w6_same_rev": 265663066, "w6_full_rev": 543297605, "exit_rev": 836176069.5982335}, "iPad": {"coverage": "Aug 9–12", "days": 4, "w7": 418, "w6_same": 390, "w6_full": 698, "exit": 748.1128205128205, "same_chg": 7.179487179487176, "exit_chg": 7.179487179487176, "w7_rev": 26116833, "w6_same_rev": 25110810, "w6_full_rev": 46250354, "exit_rev": 48103297.80715485}}, "insights": {"Mac": {"peak": "W1 was the strongest completed week at 1,604 units.", "trend": "From W1 to W6, Mac moved -18.3%; W5→W6 moved +36.7%.", "mix": "MBA M5 13\" 2026 contributes 54.1% of W7 so-far units, making it the biggest single swing factor.", "current": "W7 through Aug 12 is +29.2% vs the same Sun–Wed of W6 and is tracking to 1,692 units at exit if that uplift holds across the W6 weekday profile."}, "iPhone": {"peak": "W6 was the strongest completed week at 5,904 units.", "trend": "From W1 to W6, iPhone moved +44.5%; W5→W6 moved +25.8%.", "mix": "iPhone 17 contributes 73.1% of W7 so-far units, making const weeks=["W1","W2","W3","W4","W5","W6","W7"];

function fmt(n){return Math.round(n).toLocaleString('en-IN')}
function pct(n){return (n>=0?"+":"")+n.toFixed(1)+"%"}
function cr(n){return "₹"+(n/10000000).toFixed(1)+" Cr"}
function cls(n){return n>=0?"good":"bad"}

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active');
});

function lineChart(el, series, opts={}){
  const W=1000,H=300,p={l:55,r:28,t:28,b:42};
  const vals=series.flatMap(s=>s.values);
  const max=Math.max(...vals,1)*1.16, min=0;
  const x=i=>p.l+i*(W-p.l-p.r)/(weeks.length-1);
  const y=v=>p.t+(max-v)/(max-min)*(H-p.t-p.b);
  const palette={iPhone:'#63d297',Mac:'#f0bf5a',iPad:'#d6a7ff'};
  let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  for(let k=0;k<5;k++){let yy=p.t+k*(H-p.t-p.b)/4;let val=max*(1-k/4);svg+=`<line class="gridline" x1="${p.l}" x2="${W-p.r}" y1="${yy}" y2="${yy}"/><text class="tick" x="${p.l-8}" y="${yy+4}" text-anchor="end">${Math.round(val).toLocaleString()}</text>`}
  weeks.forEach((w,i)=>svg+=`<text class="tick" x="${x(i)}" y="${H-14}" text-anchor="middle">${w}</text>`);
  series.forEach((s,si)=>{
    const color=palette[s.name] || '#e8e8e8';
    const d=s.values.map((v,i)=>(i?'L':'M')+x(i)+','+y(v)).join(' ');
    svg+=`<path d="${d}" class="linepath" style="stroke:${color};stroke-width:${series.length===1?3:2.8}"/>`;
    s.values.forEach((v,i)=>{
      const yy=y(v), labelOffset = series.length===1 ? -11 : (si===0 ? -12 : (si===1 ? 17 : -25));
      svg+=`<circle class="point" cx="${x(i)}" cy="${yy}" r="4" style="fill:${color}"><title>${s.name} — ${weeks[i]} — ${fmt(v)} units</title></circle>`;
      svg+=`<text class="chartvalue" x="${x(i)}" y="${yy+labelOffset}" text-anchor="middle">${fmt(v)}</text>`;
      if(i===s.values.length-1 && series.length>1) svg+=`<text x="${x(i)-5}" y="${yy+34}" text-anchor="end" style="fill:${color};font-size:12px;font-weight:750;paint-order:stroke;stroke:#14181d;stroke-width:3px">${s.name}</text>`;
    });
  });
  svg+=`</svg>`; el.innerHTML=svg;
}
function barCompare(el, items){
  const W=1000,H=300,p={l:110,r:25,t:16,b:34};
  const max=Math.max(...items.flatMap(x=>[x.a,x.b]),1)*1.1;
  const group=(W-p.l-p.r)/items.length, bw=group*.26;
  let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  for(let k=0;k<5;k++){let yy=p.t+k*(H-p.t-p.b)/4;svg+=`<line class="gridline" x1="${p.l}" x2="${W-p.r}" y1="${yy}" y2="${yy}"/>`}
  items.forEach((it,i)=>{
    const cx=p.l+i*group+group/2, h1=(it.a/max)*(H-p.t-p.b), h2=(it.b/max)*(H-p.t-p.b);
    const y1=H-p.b-h1, y2=H-p.b-h2;
    svg+=`<rect class="bar2" x="${cx-bw-3}" y="${y1}" width="${bw}" height="${h1}" rx="3"><title>${it.name} prior: ${fmt(it.a)}</title></rect>`;
    svg+=`<rect class="bar" x="${cx+3}" y="${y2}" width="${bw}" height="${h2}" rx="3"><title>${it.name} current: ${fmt(it.b)}</title></rect>`;
    svg+=`<text class="barvalue" x="${cx-bw/2-3}" y="${Math.max(y1-8,14)}" text-anchor="middle">${fmt(it.a)}</text>`;
    svg+=`<text class="barvalue" x="${cx+bw/2+3}" y="${Math.max(y2-8,14)}" text-anchor="middle">${fmt(it.b)}</text>`;
    svg+=`<text class="tick" x="${cx}" y="${H-12}" text-anchor="middle">${it.name}</text>`;
  });svg+=`</svg>`;el.innerHTML=svg;
}

  });
  const w6sum=D.deep.Mac.w6_full+D.deep.iPhone.w6_full+D.deep.iPad.w6_full, todaysum=D.deep.Mac.w7+D.deep.iPhone.w7+D.deep.iPad.w7, exitsum=D.deep.Mac.exit+D.deep.iPhone.exit+D.deep.iPad.exit;
  html+=`<div class="card kpi"><div class="label">Combined W7 outlook</div><div class="value">${fmt(exitsum)}</div><div class="delta good">Projected 7-day exit</div><div class="compare3"><div><div class="t">W6 · 7 days</div><div class="n">${fmt(w6sum)}</div></div><div><div class="t">W7 · today</div><div class="n">${fmt(todaysum)}</div></div><div><div class="t">W7 · exit</div><div class="n">${fmt(exitsum)}</div></div></div></div>`;
  html+=`<div class="card wide"><h3>What the quarter is saying</h3><div class="insight"><b>iPhone is the acceleration engine.</b> Completed weekly sell-out expanded from ${fmt(D.lobWeek.iPhone[0])} in W1 to ${fmt(D.lobWeek.iPhone[5])} in W6, a ${pct((D.lobWeek.iPhone[5]/D.lobWeek.iPhone[0]-1)*100)} move.</div><div class="insight"><b>Mac recovered sharply in W6.</b> After bottoming at ${fmt(Math.min(...D.lobWeek.Mac.slice(0,6)))} units in W4, Mac rebounded to ${fmt(D.lobWeek.Mac[5])} in W6; W7 pace remains ahead of comparable W6 days.</div><div class="insight"><b>iPad is positive but softer.</b> W7 comparable-day growth is ${pct(D.deep.iPad.same_chg)}, with exit tracking ${pct(D.deep.iPad.exit_chg)} above W6.</div></div>`;
  html+=`<div class="card side"><h3>How to read W7</h3><div class="insight"><b>Same elapsed days</b> measures Sun–Wed W7 against Sun–Wed W6.</div><div class="insight"><b>7 days vs today vs exit</b> shows full W6 actual, W7 actual through Aug 12, and the projected full-week W7 exit.</div><div class="tiny muted">Exit forecast applies the W7 Sun–Wed uplift vs W6 Sun–Wed to the full W6 7-day base. It is a run-rate forecast, not an actual.</div></div>`;
  html+=`<div class="card full"><h3>Leadership readout</h3><div class="callout">W7 is frozen through Aug 12 across all three LOBs for a clean Sun–Wed comparison. Comparable-day performance is ahead across Mac <b>+29.2%</b>, iPhone <b>+59.5%</b>, and iPad <b>+7.2%</b>. The new 7-day → today → exit view separates actual progress from the forecast and makes the full-week comparison explicit.</div></div>`;
  el.innerHTML=html;
}
function buildLob(){
  const pal={iPhone:'#63d297',Mac:'#f0bf5a',iPad:'#d6a7ff'};
  document.getElementById('lobLegend').innerHTML=['iPhone','Mac','iPad'].map(l=>`<div class="legend-item"><span class="legend-swatch" style="background:${pal[l]}"></span><b>${l}</b></div>`).join('');
  lineChart(document.getElementById('lobChart'),[
    {name:"iPhone",values:D.lobWeek.iPhone},{name:"Mac",values:D.lobWeek.Mac},{name:"iPad",values:D.lobWeek.iPad}
  ]);
  let h="<h3>LOB-level intelligence</h3>";
  ["Mac","iPhone","iPad"].forEach(l=>{const i=D.insights[l];h+=`<div class="insight"><b>${l}:</b> ${i.peak} ${i.trend} ${i.current}</div>`});
  document.getElementById('lobNarrative').innerHTML=h;
}
function buildSubSelectors(){
  const lob=document.getElementById('lobSelect'), sub=document.getElementById('subSelect');
  function refresh(){
    sub.innerHTML=D.subLob[lob.value].map((x,i)=>`<option value="${i}">${x.name}</option>`).join("");
    renderSub();
  }
  lob.onchange=refresh;sub.onchange=renderSub;refresh();
}
function renderSub(){
  const lob=document.getElementById('lobSelect').value, idx=+document.getElementById('subSelect').value||0;
  const s=D.subLob[lob][idx];
  lineChart(document.getElementById('subChart'),[{name:s.name,values:s.weeks}]);
  const full=s.weeks.slice(0,6), peak=Math.max(...full), peakW=full.indexOf(peak)+1;
  const chg=s.weeks[5]?((s.weeks[6]/s.weeks[5]-1)*100):0;
  const totalW7=D.lobWeek[lob][6], share=totalW7?s.weeks[6]/totalW7*100:0;
  document.getElementById('subSnapshot').innerHTML=`<h3>${s.name} — readout</h3>
    <div class="insight">Peak completed week: <b>W${peakW} at ${fmt(peak)} units</b>. W7 so-far is <b>${fmt(s.weeks[6])}</b>, representing <b>${share.toFixed(1)}%</b> of ${lob} W7 units.</div>
    <div class="insight">Raw W7 vs full W6 is <b class="${cls(chg)}">${pct(chg)}</b>; use the Current Week Deep Dive for elapsed-day and exit-normalised comparison.</div>`;
  const ranks=[...D.subLob[lob]].sort((a,b)=>b.weeks[6]-a.weeks[6]).slice(0,6);
  document.getElementById('subRanking').innerHTML=`<h3>W7 mix — top sub-LOBs</h3>${ranks.map((x,i)=>`<div class="rank"><span>${i+1}. ${x.name}</span><span><b>${fmt(x.weeks[6])}</b> <span class="muted">${(x.weeks[6]/totalW7*100).toFixed(1)}%</span></span></div>`).join("")}`;
}
function buildDeep(){
  const el=document.getElementById('deepGrid');let html="";
  ["Mac","iPhone","iPad"].forEach(l=>{const d=D.deep[l];
    html+=`<div class="card kpi"><div class="label">${l} comparable-day change</div><div class="value ${cls(d.same_chg)}">${pct(d.same_chg)}</div><div class="tiny muted">W7 ${d.coverage}: ${fmt(d.w7)} vs ${fmt(d.w6_same)} in same elapsed W6 days</div></div>`;
  });
  html+=`<div class="card kpi"><div class="label">Combined W7 exit</div><div class="value">${fmt(D.deep.Mac.exit+D.deep.iPhone.exit+D.deep.iPad.exit)}</div><div class="tiny muted">W7 comparable-day uplift applied to full W6 7-day base</div></div>`;
  html+=`<div class="card full"><h3>So-far vs comparable W6 days</h3><div id="deepBars" class="chart"></div></div>`;
  html+=`<div class="card half"><h3>Exit vs full W6</h3><table class="table"><thead><tr><th>LOB</th><th>W6 full</th><th>W7 exit</th><th>Change</th></tr></thead><tbody>
    ${["Mac","iPhone","iPad"].map(l=>{const d=D.deep[l];return `<tr><td>${l}</td><td>${fmt(d.w6_full)}</td><td><b>${fmt(d.exit)}</b></td><td class="${cls(d.exit_chg)}">${pct(d.exit_chg)}</td></tr>`}).join("")}
    </tbody></table></div>`;
  html+=`<div class="card half"><h3>Revenue pace</h3><table class="table"><thead><tr><th>LOB</th><th>W7 so far</th><th>Projected exit</th><th>vs W6 rev</th></tr></thead><tbody>
    ${["Mac","iPhone","iPad"].map(l=>{const d=D.deep[l],chg=(d.exit_rev/d.w6_full_rev-1)*100;return `<tr><td>${l}</td><td>${cr(d.w7_rev)}</td><td><b>${cr(d.exit_rev)}</b></td><td class="${cls(chg)}">${pct(chg)}</td></tr>`}).join("")}
    </tbody></table></div>`;
  html+=`<div class="card full"><h3>Decision intelligence</h3>
    <div class="insight"><b>Mac:</b> current pace is the strongest relative improvement. Exit is tracking near <b>${fmt(D.deep.Mac.exit)} units</b>, about <b>${pct(D.deep.Mac.exit_chg)}</b> above W6, suggesting W6 was not just a one-week rebound if the final days hold.</div>
    <div class="insight"><b>iPhone:</b> absolute scale remains dominant. On the clean Aug 9–12 comparison, comparable-day sell-out is <b>+59.5%</b>; projected exit is <b>${fmt(D.deep.iPhone.exit)}</b>, or <b>+59.5%</b> vs W6 if the current uplift holds across the W6 weekday profile.</div>
    <div class="insight"><b>iPad:</b> the week is positive but fragile: only <b>+7.2%</b> on comparable days and a projected <b>+4.8%</b> exit. This is the LOB where the remaining days matter most to avoid flattening back to W6.</div>
    <div class="insight"><b>Mix concentration matters:</b> W7 is heavily led by a few products — iPhone 17, MacBook Air M5 13-inch and iPad 11th Gen. Any availability or conversion shift in these hero sub-LOBs will disproportionately move the final-week outcome.</div>
  </div>`;
  el.innerHTML=html;
  barCompare(document.getElementById('deepBars'),["Mac","iPhone","iPad"].map(l=>({name:l,a:D.deep[l].w6_same,b:D.deep[l].w7})));
}
